# Data-only theme plugin: no wasm, no capabilities.
id = "fgbg.mori"
name = "Mori"
version = "0.3.0"
description = "Mung-bean light themes in four depths: layered surfaces, three text tiers, neutral borders."
authors = ["fgbg"]
license = "MIT"
engines.openidea = "^1.2"
categories = ["themes"]
icon = "icon.svg"

[[contributes.themes]]
path = "themes/mori-soft.theme.json"
editor-scheme = "themes/mori-soft.scheme.json"

[[contributes.themes]]
path = "themes/mori.theme.json"
editor-scheme = "themes/mori.scheme.json"

[[contributes.themes]]
path = "themes/mori-deep.theme.json"
editor-scheme = "themes/mori-deep.scheme.json"

[[contributes.themes]]
path = "themes/mori-forest.theme.json"
editor-scheme = "themes/mori-forest.scheme.json"
